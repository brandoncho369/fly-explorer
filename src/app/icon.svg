<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="64" height="64" rx="14" fill="#07080c"/>
  <!-- a spike train: flat, one action potential, flat -->
  <polyline points="8,40 22,40 27,40 31,14 35,50 39,40 56,40" fill="none" stroke="#fbbf24" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- the neuron that fired -->
  <circle cx="31" cy="14" r="4.5" fill="#fbbf24"/>
  <!-- two quiet neighbours -->
  <circle cx="14" cy="22" r="2.5" fill="#59bff2" opacity="0.9"/>
  <circle cx="50" cy="24" r="2.5" fill="#59bff2" opacity="0.9"/>
</svg>
